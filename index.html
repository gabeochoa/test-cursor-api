<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Blast (JS)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <div class="title">Block Blast</div>
          <div class="subtitle">Place blocks • Clear lines • Don’t get stuck</div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
            <!-- Flame effects overlay -->
            <div class="flames-overlay" id="flamesOverlay">
              <div class="flames-container">
                <div class="flame flame-1"></div>
                <div class="flame flame-2"></div>
                <div class="flame flame-3"></div>
                <div class="flame flame-4"></div>
                <div class="flame flame-5"></div>
                <div class="flame flame-6"></div>
                <div class="flame flame-7"></div>
                <div class="flame flame-8"></div>
              </div>
            </div>
          </div>
          <div class="stat">
            <div class="stat-label">Best</div>
            <div class="stat-value" id="bestScore">0</div>
          </div>
          <button class="btn" id="newGameBtn" type="button">New game</button>
        </div>
      </header>

      <main class="main">
        <section class="board-wrap">
          <div class="board" id="board" aria-label="Game board"></div>
          <div class="hint" id="hint">
            Drag a piece to the board. Lines clear when full.
          </div>
        </section>

        <aside class="side">
          <div class="panel">
            <div class="pieces" id="pieces" aria-label="Available pieces"></div>
            <div class="panel-help">
              Tip: you can place pieces anywhere—no gravity.
            </div>
          </div>
        </aside>
      </main>
    </div>

    <div class="modal" id="gameOverModal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Game over">
        <div class="modal-title">Game over</div>
        <div class="modal-text">
          No more moves with the current pieces.
        </div>
        <div class="modal-actions">
          <button class="btn primary" id="playAgainBtn" type="button">
            Play again
          </button>
        </div>
      </div>
    </div>

    <div class="drag-layer" id="dragLayer" aria-hidden="true"></div>

    <script src="./game.js"></script>
  </body>
</html>
